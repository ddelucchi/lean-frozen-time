name: Lean verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Write transport probe
        shell: bash
        run: |
          printf 'diagnostic transport works\n' > ci-diagnostic.txt

      - name: Commit transport probe
        shell: bash
        run: |
          git config user.name "lean-ci"
          git config user.email "lean-ci@users.noreply.github.com"
          git add ci-diagnostic.txt
          git commit -m "CI transport probe [skip lean-ci]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
