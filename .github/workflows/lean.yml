name: One-file Lean certificate verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  one-file-certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout proof
        uses: actions/checkout@v4

      - name: Enforce exactly one repository Lean source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t sources < <(find . -path './.git' -prune -o -path './.lake' -prune -o -name '*.lean' -type f -print)
          printf 'Lean source paths:\n%s\n' "${sources[@]}"
          test "${#sources[@]}" -eq 1
          test "${sources[0]}" = './RelativeRest_OneFile_Certificate.lean'
          test ! -e lakefile.lean

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Select pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          elan default "$(cat lean-toolchain)"
          lean --version
          lake --version

      - name: Fetch mathlib
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get

      - name: Lean kernel verification of ONE complete certificate
        shell: bash
        run: |
          set -o pipefail
          lake --no-ansi build RelativeRest_OneFile_Certificate 2>&1 | tee certificate-build.log

      - name: Archive single-certificate build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-file-lean-proof-build
          path: certificate-build.log
          if-no-files-found: warn
