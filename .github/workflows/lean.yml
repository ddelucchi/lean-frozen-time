name: Lean verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Run Lean and capture diagnostic
        shell: bash
        run: |
          set +e
          {
            echo "=== install elan ==="
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
            export PATH="$HOME/.elan/bin:$PATH"
            echo "=== pinned toolchain ==="
            cat lean-toolchain
            elan default "$(cat lean-toolchain)"
            lean --version
            lake --version
            echo "=== resolve dependencies ==="
            lake update
            echo "=== mathlib cache ==="
            lake exe cache get
            echo "=== build certificate ==="
            lake --no-ansi build
          } > build.log 2>&1
          status=$?
          {
            echo "exit_status=$status"
            echo
            cat build.log
          } > ci-diagnostic.txt
          exit 0

      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name "lean-ci"
          git config user.email "lean-ci@users.noreply.github.com"
          git add ci-diagnostic.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "CI diagnostic [skip lean-ci]"
          git push origin HEAD:${{ github.ref_name }}
