name: Lean verification

on:
  push:
    branches:
      - "formalization/deep-forced-pass-2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Build and persist Lean transcript
        shell: bash
        run: |
          set +e
          BRANCH="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"
          git clone --depth 1 --branch "$BRANCH" "https://github.com/$REPO.git" src
          cd src
          mkdir -p ci
          {
            echo "=== Lean frozen-time CI ==="
            echo "commit: $GITHUB_SHA"
            echo "branch: $BRANCH"
            echo
            echo "=== install elan ==="
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
            export PATH="$HOME/.elan/bin:$PATH"
            echo
            echo "=== toolchain ==="
            elan default "$(cat lean-toolchain)"
            lean --version
            lake --version
            echo
            echo "=== lake update ==="
            lake update
            UPDATE_STATUS=$?
            echo "lake update status: $UPDATE_STATUS"
            echo
            if [ "$UPDATE_STATUS" -eq 0 ]; then
              echo "=== mathlib cache ==="
              lake exe cache get
              CACHE_STATUS=$?
            else
              CACHE_STATUS=99
            fi
            echo "cache status: $CACHE_STATUS"
            echo
            if [ "$UPDATE_STATUS" -eq 0 ]; then
              echo "=== lake build ==="
              lake --no-ansi build
              BUILD_STATUS=$?
            else
              BUILD_STATUS=99
            fi
            echo
            echo "lake build status: $BUILD_STATUS"
          } 2>&1 | tee ci/last-build.log

          BUILD_STATUS=${PIPESTATUS[0]}
          git config user.name "lean-ci"
          git config user.email "lean-ci@users.noreply.github.com"
          git add ci/last-build.log lake-manifest.json 2>/dev/null
          git commit -m "ci: persist Lean build transcript [skip ci]" || true
          git remote set-url origin "https://x-access-token:$GH_TOKEN@github.com/$REPO.git"
          git push origin "HEAD:$BRANCH"

          exit "$BUILD_STATUS"
