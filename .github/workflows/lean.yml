name: Lean verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write artifact probe
        shell: bash
        run: |
          printf 'artifact transport works\n' > ci-diagnostic.txt

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: lean-ci-diagnostic
          path: ci-diagnostic.txt
          if-no-files-found: error
